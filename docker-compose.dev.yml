x-api-dev-image: &api-dev-image
  image: pma-management/api:dev
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: base

services:
  postgres:
    image: postgres:16-alpine
    container_name: pma-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-pma_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # 5432 is already used by the local Previene database.
      - "55435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    <<: *api-dev-image
    container_name: pma-migrate
    command: npm run db:migrate --workspace=@pma/api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-pma_db}
    volumes:
      - ./apps/api:/app/apps/api
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-dev-image
    container_name: pma-api
    command: npm run dev --workspace=@pma/api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-pma_db}
      PORT: 3001
      COOKIE_SECURE: "false"
      FRONTEND_ORIGIN: https://sigtar.gobiernogalapagos.gob.ec
      STORAGE_ROOT: /data/storage
      STORAGE_PUBLIC_BASE_URL: http://localhost:3001/storage
      TITILER_DATA_ROOT: /data/storage
      # Loopback inside a container is the container itself; host-gateway below
      # is what makes the host's reports API reachable.
      PREVIENE_API_BASE_URL: ${PREVIENE_API_BASE_URL:-http://host.docker.internal:8080}
      PREVIENE_API_KEY: ${PREVIENE_API_KEY:-}
      PREVIENE_MEDIA_TIMEOUT_MS: ${PREVIENE_MEDIA_TIMEOUT_MS:-30000}
      # Read by the api to decide when the cache counts as stale; without it the
      # degraded banner is timed off zod's default instead of the real interval.
      PREVIENE_SYNC_INTERVAL_MS: ${PREVIENE_SYNC_INTERVAL_MS:-120000}
      # Process the PG2030 AI classification queue in the worker.
      PG2030_JOBS_ENABLED: "true"
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-http://ollama:11434/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-qwen3.5:2b-q4_K_M}
      # PG2030 Word report: its own provider (e.g. OpenRouter). Empty = NVIDIA_* above.
      PG2030_INFORME_IA_BASE_URL: ${PG2030_INFORME_IA_BASE_URL:-}
      PG2030_INFORME_IA_MODEL: ${PG2030_INFORME_IA_MODEL:-}
      PG2030_INFORME_IA_API_KEY: ${PG2030_INFORME_IA_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api:/app/apps/api
      - /mnt/synology_smb/sistema-ambiental:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - sigtar-previene-link
    restart: unless-stopped

  web:
    image: pma-management/web:dev
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: base
    container_name: pma-web
    user: root
    command: sh -c "npm run dev --workspace=@pma/web -- -H 0.0.0.0"
    environment:
      NODE_ENV: development
      PORT: 3000
      API_BASE_URL: http://api:3001
      # RustGIS for the Workspace (the rustgis service below); in production
      # nginx serves it instead.
      RUSTGIS_DEV_URL: http://rustgis:8080
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
    depends_on:
      - api
    restart: unless-stopped

  # Raster worker (dev): Node + GDAL with hot-reload. Bind-mounts ./apps/api for
  # source code and writes rasters to the same NAS mount as the API.
  # RustGIS Web (infra/rustgis/build.sh dev). Keep the :dev tag distinct from prod.
  rustgis:
    image: pma-management/rustgis:dev
    container_name: pma-rustgis
    expose:
      - "8080"
    restart: unless-stopped

  worker:
    image: pma-management/worker:dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
      target: base
    container_name: pma-worker
    command: npm run worker:watch --workspace=@pma/api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-pma_db}
      STORAGE_ROOT: /data/storage
      GDAL_CACHEMAX: "1024"
      WORKER_CONCURRENCY: "1"
      PREVIENE_API_BASE_URL: ${PREVIENE_API_BASE_URL:-http://host.docker.internal:8080}
      PREVIENE_API_KEY: ${PREVIENE_API_KEY:-}
      PREVIENE_SYNC_INTERVAL_MS: ${PREVIENE_SYNC_INTERVAL_MS:-120000}
      PG2030_JOBS_ENABLED: "true"
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-http://ollama:11434/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-qwen3.5:2b-q4_K_M}
      # SIMAT-GAL: same as the production worker. When this stack is the one
      # serving the site (as since 2026-11-23), nothing else pulls the
      # meteorological/sea-level sources: without this SIMAT went stale.
      SIMAT_SYNC_ENABLED: "true"
      SIMAT_INAMHI_SERIES: ${SIMAT_INAMHI_SERIES:-1}
      SIMAT_INAMHI_ORIGIN: ${SIMAT_INAMHI_ORIGIN:-https://inamhi.gob.ec}
      SIMAT_INAMHI_REFERER: ${SIMAT_INAMHI_REFERER:-https://inamhi.gob.ec/info/}
      SIMAT_INAMHI_TOKEN: ${SIMAT_INAMHI_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/api:/app/apps/api
      - /mnt/synology_smb/sistema-ambiental:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - sigtar-previene-link
    restart: unless-stopped

  # Internal COG tile server (dev). No published port; reads the NAS storage the
  # dev api/worker write to.
  titiler:
    image: ghcr.io/developmentseed/titiler:0.19.2
    container_name: pma-titiler
    environment:
      PORT: "8000"
      GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
    volumes:
      - /mnt/synology_smb/sistema-ambiental:/data/storage:ro
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  sigtar-previene-link:
    external: true
