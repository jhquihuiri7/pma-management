x-api-dev-image: &api-dev-image
  image: pma-management/api:dev
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: base

services:
  postgres:
    image: postgres:16-alpine
    container_name: pma-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-pma_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    <<: *api-dev-image
    container_name: pma-migrate
    command: npm run db:migrate --workspace=@pma/api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-pma_db}
    volumes:
      - ./apps/api:/app/apps/api
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-dev-image
    container_name: pma-api
    command: npm run dev --workspace=@pma/api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-pma_db}
      PORT: 3001
      COOKIE_SECURE: "false"
      FRONTEND_ORIGIN: http://localhost:3000
      STORAGE_ROOT: /data/storage
      STORAGE_PUBLIC_BASE_URL: http://localhost:3001/storage
      TITILER_DATA_ROOT: /data/storage
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api:/app/apps/api
      - /mnt/synology_smb/sistema-ambiental:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: pma-management/web:dev
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: base
    container_name: pma-web
    user: root
    command: sh -c "npm run dev --workspace=@pma/web -- -H 0.0.0.0"
    environment:
      NODE_ENV: development
      PORT: 3000
      API_BASE_URL: http://api:3001
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
    depends_on:
      - api
    restart: unless-stopped

  # Raster worker (dev): Node + GDAL with hot-reload. Bind-mounts ./apps/api for
  # source code and writes rasters to the same NAS mount as the API.
  worker:
    image: pma-management/worker:dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
      target: base
    container_name: pma-worker
    command: npm run worker:watch --workspace=@pma/api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-pma_db}
      STORAGE_ROOT: /data/storage
      GDAL_CACHEMAX: "1024"
      WORKER_CONCURRENCY: "1"
    volumes:
      - ./apps/api:/app/apps/api
      - /mnt/synology_smb/sistema-ambiental:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Internal COG tile server (dev). No published port; reads the NAS storage the
  # dev api/worker write to.
  titiler:
    image: ghcr.io/developmentseed/titiler:0.19.2
    container_name: pma-titiler
    environment:
      PORT: "8000"
      GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
    volumes:
      - /mnt/synology_smb/sistema-ambiental:/data/storage:ro
    restart: unless-stopped

volumes:
  postgres_data:
