x-api-image: &api-image
  image: pma-management/api:prod
  build:
    context: .
    dockerfile: apps/api/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    container_name: pma-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-pma_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    # Diagnostic logging for lock contention / slow writes (e.g. geo map
    # creation timing out). All settings are runtime GUCs — no data migration,
    # a plain container recreate applies them. Tune log_min_duration_statement
    # up (or these off) once the timeout root cause is understood.
    command:
      - "postgres"
      - "-c"
      - "log_lock_waits=on"          # log any session that waits > deadlock_timeout for a lock
      - "-c"
      - "deadlock_timeout=1s"         # also the threshold that arms log_lock_waits
      - "-c"
      - "log_min_duration_statement=1000"  # log every statement slower than 1s
      - "-c"
      - "log_line_prefix=%m [%p] user=%u db=%d app=%a "  # timestamp, pid, user, db, app
      - "-c"
      - "log_min_messages=info"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    <<: *api-image
    container_name: pma-migrate
    command: ["node", "dist/apps/api/src/db/run-migrations.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-pma_db}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    container_name: pma-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-pma_db}
      PORT: 3001
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://sigtar.gobiernogalapagos.gob.ec}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      STORAGE_ROOT: /data/storage
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-https://sigtar.gobiernogalapagos.gob.ec/storage}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
    expose:
      - "3001"
    volumes:
      - /mnt/synology_smb/sistema-ambiental:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: pma-management/web:prod
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: pma-web
    environment:
      NODE_ENV: production
      PORT: 3000
      API_BASE_URL: http://api:3001
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: pma-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ${NGINX_SSL_CERT_DIR:-/etc/ssl/cgreg}:/etc/ssl/cgreg:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped

  # Raster processing worker — Node + GDAL (apps/api/Dockerfile.worker). Shares
  # the same NAS mount as the API and pulls jobs from pg-boss (in Postgres).
  # JWT secrets are passed only to satisfy the shared env validation (the worker
  # does no auth). Keep the image tag distinct from dev (pma-management/worker:dev).
  worker:
    image: pma-management/worker:prod
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    container_name: pma-worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-pma_db}
      STORAGE_ROOT: /data/storage
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      GDAL_CACHEMAX: ${GDAL_CACHEMAX:-1024}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      RASTER_KEEP_ORIGINAL: ${RASTER_KEEP_ORIGINAL:-true}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
    volumes:
      - /mnt/synology_smb/sistema-ambiental:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Internal COG tile server. Deliberately has NO published port: only the API
  # (same compose network) reaches it, and the API injects the file path — so
  # TiTiler can never be driven to read arbitrary files from the browser. NAS is
  # mounted read-only.
  titiler:
    image: ghcr.io/developmentseed/titiler:0.19.2
    container_name: pma-titiler
    environment:
      PORT: "8000"
      GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
      GDAL_CACHEMAX: "200"
    volumes:
      - /mnt/synology_smb/sistema-ambiental:/data/storage:ro
    restart: unless-stopped

volumes:
  postgres_data:
