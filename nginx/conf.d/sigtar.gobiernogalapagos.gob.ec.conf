server {
    listen 80;
    server_name sigtar.gobiernogalapagos.gob.ec www.sigtar.gobiernogalapagos.gob.ec;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sigtar.gobiernogalapagos.gob.ec www.sigtar.gobiernogalapagos.gob.ec;

    ssl_certificate /etc/ssl/cgreg/star_gobiernogalapagos_gob_ec.crt;
    ssl_certificate_key /etc/ssl/cgreg/gobiernogalapagos_wildcard.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 6g;

    # Docker's embedded DNS. Re-resolving on each request means that when a
    # container is recreated on deploy (and gets a new IP) nginx picks it up
    # within `valid` instead of caching the old IP and returning 502 forever.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Retry transient upstream failures (e.g. a container restarting mid-deploy)
    # instead of surfacing a 502 to the browser.
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 10s;

    location /api-proxy/ {
        set $api_upstream http://api:3001;
        rewrite ^/api-proxy/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;

        # Large raster/orthophoto uploads: stream straight to the API instead of
        # buffering multi-GB bodies to disk first, and allow slow uploads to run
        # without nginx cutting the connection mid-transfer.
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /storage/ {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
